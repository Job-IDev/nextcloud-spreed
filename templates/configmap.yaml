{{- if .Values.signaling.enabled -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app: {{ .Release.Name }}-signaling
data:
  server.conf: |
    [server]
    listen = 0.0.0.0:8080

    [appinfo]
    id = spreed

    # ----------------------------------------------------
    # 1. YOUR EXISTING CONFIG (Keep your original values here)
    # ----------------------------------------------------
    [backend]
    backends = backend-1
    allowall = false
    timeout = 10
    connectionsperhost = 8

    [backend-1]
    # The URL to your Nextcloud instance
    backends = {{ .Values.signaling.backend.url }}
    # The shared secret configured in your Nextcloud Talk settings
    secret = {{ .Values.signaling.backend.secret }}

    [sessions]
    # Session secrets
    hashkey = {{ .Values.signaling.sessions.hashkey }}
    blockkey = {{ .Values.signaling.sessions.blockkey }}

    # ----------------------------------------------------
    # 2. THE NEW EXTERNAL VM CONFIG (Added for your setup)
    # ----------------------------------------------------
    [mcu]
    type = {{ .Values.signaling.mcu.type }}
    url = ws://{{ .Values.signaling.mcu.url }}

    [turn]
    apikey = {{ .Values.signaling.turn.secret }}
    secret = {{ .Values.signaling.turn.secret }}
    servers = {{ .Values.signaling.turn.server }}
    protocols = {{ .Values.signaling.turn.protocols }}

    [nats]
    url = nats://{{ .Release.Name }}-nats:4222
{{- end -}}