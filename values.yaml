# Default values for nextcloud-spreed.

# ---------------------------------------------------------
# NEXTCLOUD SIGNALING SERVER (Backend)
# ---------------------------------------------------------
signaling:
  enabled: true
  image: "strukturag/nextcloud-spreed-signaling:latest"
  pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080

  # Settings to connect the signaling server to external components
  mcu:
    type: janus
    # Use ws:// because you are testing without SSL on the VM
    url: "ws://YOUR_VM_PUBLIC_IP:8188"
  
  turn:
    server: "turn:YOUR_VM_PUBLIC_IP:3478"
    secret: "super-secret-turn-key-123"
    protocols: "udp,tcp"

# ---------------------------------------------------------
# JANUS WEBRTC GATEWAY
# ---------------------------------------------------------
# Set this to FALSE so it does not deploy inside your K8s cluster!
janus:
  enabled: false
  image: "canyan/janus-gateway:latest"
  pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    wsPort: 8188
    httpPort: 8088

# ---------------------------------------------------------
# NATS MESSAGE BUS
# ---------------------------------------------------------
# Set this to TRUE so the signaling pod can use it internally
nats:
  enabled: true
  image: "nats:alpine"
  pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 4222