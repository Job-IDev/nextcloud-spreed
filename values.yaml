# Default values for nextcloud-spreed.

# ---------------------------------------------------------
# NEXTCLOUD SIGNALING SERVER (Backend)
# ---------------------------------------------------------
signaling:
  enabled: true
  image: "strukturag/nextcloud-spreed-signaling:latest"
  pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 8080

  # 1. External Media & TURN Settings (Azure VM)
  mcu:
    type: janus
    url: "YOUR_VM_PUBLIC_IP:8188"
  
  turn:
    server: "turn:YOUR_VM_PUBLIC_IP:3478"
    secret: "super-secret-turn-key-123"
    protocols: "udp,tcp"

  # 2. Your Existing Nextcloud Connection Settings
  backend:
    url: "https://nextcloud.yourdomain.com"
    secret: "your-nextcloud-shared-secret"
    
  # 3. Your Existing Session Keys
  sessions:
    # Hashkey must be 32 or 64 bytes
    hashkey: "your-session-hash-key-here"
    # Blockkey must be exactly 16, 24, or 32 bytes
    blockkey: "your-session-block-key-here"

# ---------------------------------------------------------
# JANUS WEBRTC GATEWAY
# ---------------------------------------------------------
# Set this to FALSE so it does not deploy inside your K8s cluster!
janus:
  enabled: false
  image: "canyan/janus-gateway:latest"
  pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    wsPort: 8188
    httpPort: 8088

# ---------------------------------------------------------
# NATS MESSAGE BUS
# ---------------------------------------------------------
# Set this to TRUE so the signaling pod can use it internally
nats:
  enabled: true
  image: "nats:alpine"
  pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 4222

ingress:
  enabled: true
  className: "nginx" # Change this if you use traefik, haproxy, etc.
  annotations: {}
    # Example for cert-manager:
    # cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  hosts:
    - host: signaling.yourdomain.com
      paths:
        - path: /
          pathType: Prefix
  tls: []
  #  - secretName: signaling-tls
  #    hosts:
  #      - signaling.yourdomain.com